<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vacuum Gauge</title>
<style>
  /* Floating panel for ncSender Pro. Runs in its own frame, polls the plugin
     script for the latest reading and draws it in the chosen style. */
  :root {
    --bg: var(--color-surface, #18222b);
    --text: var(--color-text-primary, #eef2f5);
    --muted: var(--color-text-secondary, #9aa7b3);
    --line: var(--color-border, #34414d);
    --zone: #7d8a96;
  }
  html[data-theme="light"] { --bg: var(--color-surface, #ffffff); --text: var(--color-text-primary, #1c2630); --muted: var(--color-text-secondary, #5b6975); --line: var(--color-border, #d5dce2); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-family, system-ui, sans-serif); overflow: hidden; user-select: none; -webkit-user-select: none; }
  #root { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 10px; gap: 2px; }
  .label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .06em; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--zone); flex: none; }
  .value { display: flex; align-items: baseline; gap: 6px; line-height: 1; }
  .num { font-weight: 700; font-variant-numeric: tabular-nums; font-size: min(17vw, 34vh); }
  .unit { font-size: 12px; color: var(--muted); }
  .sub { font-size: 10px; color: var(--muted); text-align: center; min-height: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  svg { display: block; width: min(78vw, 150vh); height: auto; }
  .bar { position: relative; width: 86%; height: 10px; margin: 6px 0 2px; }
  .bar .segs { display: flex; height: 100%; border-radius: 5px; overflow: hidden; }
  .bar .segs span:nth-child(1) { background: #e5484d; } .bar .segs span:nth-child(2) { background: #f5b83d; } .bar .segs span:nth-child(3) { background: #3fb950; flex: 1; }
  .bar .mark { position: absolute; top: -4px; bottom: -4px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--text); box-shadow: 0 0 0 1.5px var(--bg); transition: left .3s ease-out; }
  /* style: dial */
  .s-dial .num { font-size: min(11vw, 20vh); }
  /* style: bar */
  .s-bar .num { font-size: min(14vw, 26vh); }
  /* style: slim */
  .s-slim #root { flex-direction: row; gap: 8px; }
  .s-slim .num { font-size: min(12vw, 30vh); }
  .s-slim .sub { display: none; }
  /* style: block */
  .s-block body, body.s-block { background: var(--zone); }
  body.s-block { color: var(--on-zone, #fff); }
  body.s-block .unit, body.s-block .sub { color: inherit; opacity: .8; }
  body.s-block .dot { background: currentColor; }
  body.s-block .num { font-size: min(24vw, 46vh); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var PLUGIN_ID = '__PLUGIN_ID__';
  var PORT = '__SERVER_PORT__';
  var STYLES = ['number', 'dial', 'bar', 'slim', 'block'];
  var ZONES = {
    green:  { label: 'HOLDING',   color: '#3fb950', on: '#0b1410' },
    yellow: { label: 'MARGINAL',  color: '#f5b83d', on: '#1a1300' },
    red:    { label: 'TOO WEAK',  color: '#e5484d', on: '#ffffff' },
    off:    { label: 'NO SIGNAL', color: '#7d8a96', on: '#ffffff' }
  };
  var root = document.getElementById('root');
  var built = null, busy = false, fails = 0, lastCfg = { greenAt: -15, yellowAt: -8, miniStyle: 'number' };

  function apiBase() {
    var host = '', proto = 'http:';
    try { host = location.hostname; proto = location.protocol; } catch (e) {}
    if (!host) { try { host = window.parent.location.hostname; proto = window.parent.location.protocol; } catch (e2) {} }
    if (!host) host = 'localhost';
    if (proto !== 'https:') proto = 'http:';
    var port = /^\d+$/.test(PORT) ? PORT : '';
    if (!port) { try { port = location.port || window.parent.location.port; } catch (e3) {} }
    return proto + '//' + host + (port ? ':' + port : '');
  }
  var API = apiBase() + '/api/plugins/' + (PLUGIN_ID.indexOf('__') === 0 ? 'community.vacuum-gauge' : PLUGIN_ID) + '/request';

  function frac(v) { return Math.min(30, Math.max(0, -v)) / 30; }
  function zoneKey(r, cfg) {
    if (!r || !r.ok || typeof r.inHg !== 'number') return 'off';
    if (r.inHg <= cfg.greenAt) return 'green';
    if (r.inHg <= cfg.yellowAt) return 'yellow';
    return 'red';
  }

  function build(style) {
    var label = '<div class="label"><span class="dot"></span><span id="lab">VACUUM</span></div>';
    var value = '<div class="value"><span class="num" id="num">--.-</span><span class="unit">inHg</span></div>';
    var sub = '<div class="sub" id="sub"></div>';
    var html;
    if (style === 'dial') {
      html = label +
        '<svg viewBox="0 0 140 76" aria-hidden="true">' +
          '<path id="a-red" fill="none" stroke="#e5484d" stroke-width="10"/>' +
          '<path id="a-yel" fill="none" stroke="#f5b83d" stroke-width="10"/>' +
          '<path id="a-grn" fill="none" stroke="#3fb950" stroke-width="10"/>' +
          '<line id="needle" x1="70" y1="70" x2="70" y2="28" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" style="transition:transform .3s ease-out;transform-origin:70px 70px"/>' +
          '<circle cx="70" cy="70" r="5" fill="currentColor"/>' +
        '</svg>' + value + sub;
    } else if (style === 'bar') {
      html = label + value + '<div class="bar"><div class="segs"><span id="s-red"></span><span id="s-yel"></span><span></span></div><span class="mark" id="mark"></span></div>' + sub;
    } else if (style === 'slim') {
      html = '<span class="dot"></span>' + value + '<span class="label"><span id="lab">VACUUM</span></span>' + sub;
    } else {
      html = label + value + sub;
    }
    root.innerHTML = html;
    document.body.className = 's-' + style;
    built = style;
  }

  function el(id) { return document.getElementById(id); }

  function render(r) {
    if (r && r.cfg) lastCfg = r.cfg;
    var cfg = lastCfg;
    var style = STYLES.indexOf(cfg.miniStyle) >= 0 ? cfg.miniStyle : 'number';
    if (built !== style) build(style);
    var key = zoneKey(r, cfg), z = ZONES[key], ok = key !== 'off';
    document.documentElement.style.setProperty('--zone', z.color);
    document.documentElement.style.setProperty('--on-zone', z.on);
    el('lab').textContent = z.label;
    el('num').textContent = ok ? r.inHg.toFixed(1) : '--.-';
    var sub = '';
    if (!ok) sub = (r && r.error) || 'No reply from the gauge';
    else if (r.guard && r.guard.stopping) sub = 'Vacuum lost: stopping the job';
    else if (r.guard && r.guard.weak) sub = 'Below the minimum for cutting';
    el('sub').textContent = sub;
    if (style === 'dial') {
      var pt = function (f) { var t = (180 + f * 180) * Math.PI / 180; return (70 + 54 * Math.cos(t)).toFixed(2) + ' ' + (70 + 54 * Math.sin(t)).toFixed(2); };
      var arc = function (a, b) { return b - a < 0.004 ? '' : 'M' + pt(a) + ' A54 54 0 0 1 ' + pt(b); };
      var fy = frac(cfg.yellowAt), fg = frac(cfg.greenAt);
      el('a-red').setAttribute('d', arc(0, fy));
      el('a-yel').setAttribute('d', arc(fy, fg));
      el('a-grn').setAttribute('d', arc(fg, 1));
      el('needle').style.transform = 'rotate(' + ((ok ? frac(r.inHg) : 0) * 180 - 90).toFixed(1) + 'deg)';
    } else if (style === 'bar') {
      el('s-red').style.width = (frac(cfg.yellowAt) * 100) + '%';
      el('s-yel').style.width = ((frac(cfg.greenAt) - frac(cfg.yellowAt)) * 100) + '%';
      el('mark').style.left = ((ok ? frac(r.inHg) : 0) * 100) + '%';
    }
  }

  function tick() {
    if (busy) return;
    busy = true;
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'status' }), cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function (r) { fails = 0; render(r); })
      .catch(function () { fails++; if (fails >= 3) render({ ok: false, error: 'Cannot reach ncSender', cfg: null }); })
      .then(function () { busy = false; });
  }

  build('number');
  tick();
  setInterval(tick, 500);
})();
</script>
</body>
</html>
