<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vacuum Gauge</title>
<style>
  /* Mini gauge for ncSender Pro's floating panel (frameless).
     The panel box is fixed at 320 x 210. The gauge is designed at 230 x 150
     and scaled to the chosen size, anchored to the bottom-right of the box.
     The plugin script sets the panel "shape" to the same rectangle, so the
     empty part of the box is click-through. */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body { font-family: var(--font-family, system-ui, sans-serif); user-select: none; -webkit-user-select: none; }
  #gauge {
    position: fixed; right: 0; bottom: 0; width: 230px; height: 150px;
    transform-origin: 100% 100%;
    --zone: #7d8a96; --on-zone: #ffffff;
    --text: #f2f5f8; --muted: #9aa7b3;
    background: rgba(18, 26, 34, 0.94); color: var(--text);
    border: 2px solid rgba(255, 255, 255, 0.18); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px 10px 6px; gap: 2px; cursor: grab;
  }
  html[data-theme="light"] #gauge { --text: #1c2630; --muted: #5b6975; background: rgba(255, 255, 255, 0.96); border-color: rgba(0, 0, 0, 0.18); }
  #gauge.z-red { border-color: var(--zone); }
  .tools { position: absolute; top: 2px; right: 4px; display: flex; gap: 2px; }
  .tools button { width: 30px; height: 30px; border: 0; background: none; color: inherit; opacity: .7; font-size: 17px; line-height: 1; cursor: pointer; border-radius: 6px; }
  .tools button:hover { opacity: 1; background: rgba(127, 127, 127, 0.2); }
  .label { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .06em; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--zone); flex: none; }
  .value { display: flex; align-items: baseline; gap: 6px; line-height: 1; }
  .num { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 39px; }
  .unit { font-size: 12px; color: var(--muted); }
  .sub { font-size: 10px; color: var(--muted); text-align: center; min-height: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  svg { display: block; width: 150px; height: auto; }
  .bar { position: relative; width: 86%; height: 10px; margin: 6px 0 2px; }
  .bar .segs { display: flex; height: 100%; border-radius: 5px; overflow: hidden; }
  .bar .segs span:nth-child(1) { background: #e5484d; } .bar .segs span:nth-child(2) { background: #f5b83d; } .bar .segs span:nth-child(3) { background: #3fb950; flex: 1; }
  .bar .mark { position: absolute; top: -4px; bottom: -4px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--text); box-shadow: 0 0 0 1.5px rgba(18, 26, 34, 0.9); transition: left .3s ease-out; }
  .s-dial { padding-top: 8px !important; }
  .s-dial .num { font-size: 24px; }
  .s-dial .label { align-self: flex-start; }
  .s-bar .num { font-size: 32px; }
  .s-slim { flex-direction: row !important; gap: 8px !important; }
  .s-slim .num { font-size: 28px; }
  .s-slim .sub { display: none; }
  #gauge.s-block { background: var(--zone); color: var(--on-zone); border-color: rgba(0, 0, 0, 0.25); }
  .s-block .unit, .s-block .sub { color: inherit; opacity: .8; }
  .s-block .dot { background: currentColor; }
  .s-block .num { font-size: 52px; }
</style>
</head>
<body>
<div id="gauge"></div>
<script>
(function () {
  var PLUGIN_ID = '__PLUGIN_ID__';
  var PORT = '__SERVER_PORT__';
  var STYLES = ['number', 'dial', 'bar', 'slim', 'block'];
  var BASE_W = 230, MIN_W = 140, MAX_W = 320;
  var ZONES = {
    green:  { label: 'HOLDING',   color: '#3fb950', on: '#0b1410' },
    yellow: { label: 'MARGINAL',  color: '#f5b83d', on: '#1a1300' },
    red:    { label: 'TOO WEAK',  color: '#e5484d', on: '#ffffff' },
    off:    { label: 'NO SIGNAL', color: '#7d8a96', on: '#ffffff' }
  };
  var gauge = document.getElementById('gauge');
  var built = null, busy = false, fails = 0, saving = false;
  var lastCfg = { greenAt: -15, yellowAt: -8, miniStyle: 'number', miniSize: BASE_W };

  function apiBase() {
    var host = '', proto = 'http:';
    try { host = location.hostname; proto = location.protocol; } catch (e) {}
    if (!host) { try { host = window.parent.location.hostname; proto = window.parent.location.protocol; } catch (e2) {} }
    if (!host) host = 'localhost';
    if (proto !== 'https:') proto = 'http:';
    var port = /^\d+$/.test(PORT) ? PORT : '';
    if (!port) { try { port = location.port || window.parent.location.port; } catch (e3) {} }
    return proto + '//' + host + (port ? ':' + port : '');
  }
  var PLUGIN = apiBase() + '/api/plugins/' + (PLUGIN_ID.indexOf('__') === 0 ? 'community.vacuum-gauge' : PLUGIN_ID);

  function frac(v) { return Math.min(30, Math.max(0, -v)) / 30; }
  function zoneKey(r, cfg) {
    if (!r || !r.ok || typeof r.inHg !== 'number') return 'off';
    if (r.inHg <= cfg.greenAt) return 'green';
    if (r.inHg <= cfg.yellowAt) return 'yellow';
    return 'red';
  }

  // Change one saved setting (style, or unpin). Saving restarts the plugin
  // script, which then applies the new state on every screen.
  function saveSetting(patch) {
    if (saving) return;
    saving = true;
    fetch(PLUGIN + '/settings', { cache: 'no-store' })
      .then(function (res) { return res.ok ? res.json() : {}; })
      .then(function (cur) {
        var next = {}; for (var k in cur) next[k] = cur[k];
        for (var p in patch) next[p] = patch[p];
        return fetch(PLUGIN + '/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(next) });
      })
      .catch(function () {})
      .then(function () { saving = false; });
  }

  function build(style) {
    var tools = '<div class="tools">' +
      '<button type="button" id="b-style" title="Change style" aria-label="Change mini gauge style">&#8635;</button>' +
      '<button type="button" id="b-unpin" title="Unpin" aria-label="Unpin mini gauge">&times;</button></div>';
    var label = '<div class="label"><span class="dot"></span><span id="lab">VACUUM</span></div>';
    var value = '<div class="value"><span class="num" id="num">--.-</span><span class="unit">inHg</span></div>';
    var sub = '<div class="sub" id="sub"></div>';
    var html;
    if (style === 'dial') {
      html = label +
        '<svg viewBox="0 0 140 76" aria-hidden="true">' +
          '<path id="a-red" fill="none" stroke="#e5484d" stroke-width="10"/>' +
          '<path id="a-yel" fill="none" stroke="#f5b83d" stroke-width="10"/>' +
          '<path id="a-grn" fill="none" stroke="#3fb950" stroke-width="10"/>' +
          '<line id="needle" x1="70" y1="70" x2="70" y2="28" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" style="transition:transform .3s ease-out;transform-origin:70px 70px"/>' +
          '<circle cx="70" cy="70" r="5" fill="currentColor"/>' +
        '</svg>' + value + sub;
    } else if (style === 'bar') {
      html = label + value + '<div class="bar"><div class="segs"><span id="s-red"></span><span id="s-yel"></span><span></span></div><span class="mark" id="mark"></span></div>' + sub;
    } else if (style === 'slim') {
      html = '<span class="dot"></span>' + value + '<span class="label"><span id="lab">VACUUM</span></span>' + sub;
    } else {
      html = label + value + sub;
    }
    gauge.innerHTML = tools + html;
    built = style;
    el('b-style').addEventListener('click', function () {
      var next = STYLES[(STYLES.indexOf(built) + 1) % STYLES.length];
      lastCfg.miniStyle = next;
      build(next); render(lastReading);
      saveSetting({ miniStyle: next });
    });
    el('b-unpin').addEventListener('click', function () {
      gauge.style.display = 'none';
      saveSetting({ pinned: false });
    });
  }

  function el(id) { return document.getElementById(id); }
  var lastReading = null;

  function render(r) {
    lastReading = r;
    if (r && r.cfg && !saving) lastCfg = r.cfg;
    var cfg = lastCfg;
    var style = STYLES.indexOf(cfg.miniStyle) >= 0 ? cfg.miniStyle : 'number';
    if (built !== style) build(style);
    if (!saving) gauge.style.display = cfg.pinned === false ? 'none' : '';
    var size = Math.min(MAX_W, Math.max(MIN_W, parseFloat(cfg.miniSize) || BASE_W));
    var k = size / BASE_W;
    gauge.style.transform = 'scale(' + k.toFixed(4) + ')';
    gauge.style.borderRadius = (12 / k).toFixed(1) + 'px';
    var key = zoneKey(r, cfg), z = ZONES[key], ok = key !== 'off';
    gauge.className = 's-' + style + ' z-' + key;
    gauge.style.setProperty('--zone', z.color);
    gauge.style.setProperty('--on-zone', z.on);
    el('lab').textContent = z.label;
    el('num').textContent = ok ? r.inHg.toFixed(1) : '--.-';
    var sub = '';
    if (!ok) sub = (r && r.error) || 'No reply from the gauge';
    else if (r.guard && r.guard.stopping) sub = 'Vacuum lost: stopping the job';
    else if (r.guard && r.guard.weak) sub = 'Below the minimum for cutting';
    el('sub').textContent = sub;
    if (style === 'dial') {
      var pt = function (f) { var t = (180 + f * 180) * Math.PI / 180; return (70 + 54 * Math.cos(t)).toFixed(2) + ' ' + (70 + 54 * Math.sin(t)).toFixed(2); };
      var arc = function (a, b) { return b - a < 0.004 ? '' : 'M' + pt(a) + ' A54 54 0 0 1 ' + pt(b); };
      var fy = frac(cfg.yellowAt), fg = frac(cfg.greenAt);
      el('a-red').setAttribute('d', arc(0, fy));
      el('a-yel').setAttribute('d', arc(fy, fg));
      el('a-grn').setAttribute('d', arc(fg, 1));
      el('needle').style.transform = 'rotate(' + ((ok ? frac(r.inHg) : 0) * 180 - 90).toFixed(1) + 'deg)';
    } else if (style === 'bar') {
      el('s-red').style.width = (frac(cfg.yellowAt) * 100) + '%';
      el('s-yel').style.width = ((frac(cfg.greenAt) - frac(cfg.yellowAt)) * 100) + '%';
      el('mark').style.left = ((ok ? frac(r.inHg) : 0) * 100) + '%';
    }
  }

  function tick() {
    if (busy) return;
    busy = true;
    fetch(PLUGIN + '/request', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'status' }), cache: 'no-store' })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function (r) { fails = 0; render(r); })
      .catch(function () { fails++; if (fails >= 3) render({ ok: false, error: 'Cannot reach ncSender' }); })
      .then(function () { busy = false; });
  }

  build('number');
  render(null);
  tick();
  setInterval(tick, 500);
})();
</script>
</body>
</html>
